name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the site
        run: npm run build
      - name: Check every province of every year shipped
        run: |
          for y in $(seq 2012 2021); do
            n=$(ls dist/data/geo/$y | wc -l); p=$(ls dist/data/pop/$y | wc -l)
            if [ "$n" -ne 52 ] || [ "$p" -ne 52 ]; then echo "::error::$y has $n geometry and $p population files, expected 52"; exit 1; fi
          done
